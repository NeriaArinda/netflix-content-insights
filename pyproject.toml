[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netflix-insights"
version = "1.0.0"
description = "Clean, analyse and chart the Netflix Movies & TV Shows catalogue."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Neria Fay Arinda" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
netflix-insights = "netflix_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
